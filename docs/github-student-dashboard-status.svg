<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Student Dashboard — status público</title>
  <desc id="desc">Resumo visual do estado verificável do projeto: produção ativa, CI passando, 214 testes, 97,9 por cento de cobertura e gate mínimo de 90 por cento.</desc>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif}
    .title{fill:#f0f6fc;font-size:30px;font-weight:800}
    .subtitle{fill:#8b949e;font-size:15px}
    .label{fill:#8b949e;font-size:13px}
    .value{fill:#f0f6fc;font-size:22px;font-weight:800}
    .ok{fill:#3fb950;font-size:13px;font-weight:700}
  </style>
  <rect x="1" y="1" width="958" height="298" rx="18" fill="#0d1117" stroke="#30363d"/>
  <text class="title" x="32" y="48">GitHub Student Dashboard</text>
  <text class="subtitle" x="32" y="74">Qualidade medida, reproduzível e protegida contra regressão.</text>

  <g transform="translate(32 105)">
    <rect width="168" height="92" rx="13" fill="#161b22" stroke="#238636"/>
    <text class="label" x="16" y="27">Produção</text>
    <text class="value" x="16" y="58">LIVE</text>
    <text class="ok" x="16" y="79">Render + Gunicorn</text>
  </g>
  <g transform="translate(216 105)">
    <rect width="168" height="92" rx="13" fill="#161b22" stroke="#238636"/>
    <text class="label" x="16" y="27">CI real</text>
    <text class="value" x="16" y="58">PASSANDO</text>
    <text class="ok" x="16" y="79">GitHub Actions</text>
  </g>
  <g transform="translate(400 105)">
    <rect width="168" height="92" rx="13" fill="#161b22" stroke="#238636"/>
    <text class="label" x="16" y="27">Testes</text>
    <text class="value" x="16" y="58">214</text>
    <text class="ok" x="16" y="79">automatizados</text>
  </g>
  <g transform="translate(584 105)">
    <rect width="168" height="92" rx="13" fill="#161b22" stroke="#238636"/>
    <text class="label" x="16" y="27">Cobertura</text>
    <text class="value" x="16" y="58">97,9%</text>
    <text class="ok" x="16" y="79">branches incluídos</text>
  </g>
  <g transform="translate(768 105)">
    <rect width="160" height="92" rx="13" fill="#161b22" stroke="#238636"/>
    <text class="label" x="16" y="27">Gate mínimo</text>
    <text class="value" x="16" y="58">90%</text>
    <text class="ok" x="16" y="79">regressão protegida</text>
  </g>

  <rect x="32" y="220" width="896" height="48" rx="12" fill="#11161d" stroke="#30363d"/>
  <text class="subtitle" x="50" y="242">10 playgrounds + Trilha + Matriz Viva → Python real → testes → CI → deploy público</text>
  <text class="subtitle" x="50" y="260">Execução de referência: CI #135 • pip-audit: nenhuma vulnerabilidade conhecida reportada nesse run</text>
  <text class="subtitle" x="32" y="286">Estado documentado em 15/09/2026 — valores podem evoluir com novos commits e feedback.</text>
</svg>