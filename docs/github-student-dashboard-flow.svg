<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo do GitHub Student Dashboard</title>
  <desc id="desc">GitHub API alimenta checks determinísticos, que produzem evidências e score; depois entra a explicação pedagógica.</desc>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif}
    .title{fill:#f0f6fc;font-size:26px;font-weight:800}
    .boxTitle{fill:#f0f6fc;font-size:16px;font-weight:800}
    .copy{fill:#8b949e;font-size:13px}
    .arrow{stroke:#58a6ff;stroke-width:3;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#58a6ff"/></marker></defs>
  <rect x="1" y="1" width="958" height="258" rx="18" fill="#0d1117" stroke="#30363d"/>
  <text class="title" x="32" y="44">Como o Dashboard decide</text>

  <g transform="translate(32 78)">
    <rect width="170" height="108" rx="14" fill="#161b22" stroke="#30363d"/>
    <text class="boxTitle" x="18" y="31">1. GitHub API</text>
    <text class="copy" x="18" y="57">metadados</text>
    <text class="copy" x="18" y="77">arquivos e linguagens</text>
    <text class="copy" x="18" y="97">Actions / commits</text>
  </g>
  <path class="arrow" d="M210 132 H252"/>

  <g transform="translate(260 78)">
    <rect width="190" height="108" rx="14" fill="#161b22" stroke="#238636"/>
    <text class="boxTitle" x="18" y="31">2. Checks objetivos</text>
    <text class="copy" x="18" y="57">README • licença • CI</text>
    <text class="copy" x="18" y="77">testes • dependências</text>
    <text class="copy" x="18" y="97">descrição • topics</text>
  </g>
  <path class="arrow" d="M458 132 H500"/>

  <g transform="translate(508 78)">
    <rect width="190" height="108" rx="14" fill="#161b22" stroke="#238636"/>
    <text class="boxTitle" x="18" y="31">3. Evidências</text>
    <text class="copy" x="18" y="57">score reproduzível</text>
    <text class="copy" x="18" y="77">CI real</text>
    <text class="copy" x="18" y="97">ações verificáveis</text>
  </g>
  <path class="arrow" d="M706 132 H748"/>

  <g transform="translate(756 78)">
    <rect width="172" height="108" rx="14" fill="#161b22" stroke="#58a6ff"/>
    <text class="boxTitle" x="18" y="31">4. Explicação</text>
    <text class="copy" x="18" y="57">modo local ou IA</text>
    <text class="copy" x="18" y="77">prioridade de estudo</text>
    <text class="copy" x="18" y="97">sem mudar o diagnóstico</text>
  </g>

  <text class="copy" x="32" y="225">Regra: IA não calcula score e não decide se um check passou. Ela explica fatos já medidos.</text>
</svg>