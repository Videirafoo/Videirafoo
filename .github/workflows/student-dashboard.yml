name: GitHub Student Dashboard CI

on:
  push:
    branches: ["main"]
    paths:
      - "projetos/github_student_dashboard/**/*.py"
      - "projetos/github_student_dashboard/**/*.html"
      - "projetos/github_student_dashboard/**/*.js"
      - "projetos/github_student_dashboard/**/*.css"
      - "projetos/github_student_dashboard/requirements.txt"
      - ".github/workflows/student-dashboard.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "projetos/github_student_dashboard/**/*.py"
      - "projetos/github_student_dashboard/**/*.html"
      - "projetos/github_student_dashboard/**/*.js"
      - "projetos/github_student_dashboard/**/*.css"
      - "projetos/github_student_dashboard/requirements.txt"
      - ".github/workflows/student-dashboard.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r projetos/github_student_dashboard/requirements.txt

      - name: Validate Python syntax
        run: python -m compileall -q projetos/github_student_dashboard

      - name: Validate JavaScript syntax
        run: |
          node --check projetos/github_student_dashboard/static/laboratorio.js
          node --check projetos/github_student_dashboard/static/laboratorio_api_real.js

      - name: Run dashboard tests
        run: python -m unittest discover -s projetos/github_student_dashboard -t . -p "test_*.py"
