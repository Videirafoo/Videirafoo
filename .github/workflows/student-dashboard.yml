name: GitHub Student Dashboard CI

on:
  push:
    branches: ["main"]
    paths:
      - "projetos/github_student_dashboard/**/*.py"
      - "projetos/github_student_dashboard/**/*.html"
      - "projetos/github_student_dashboard/**/*.js"
      - "projetos/github_student_dashboard/**/*.css"
      - "projetos/github_student_dashboard/requirements.txt"
      - "projetos/github_student_dashboard/requirements-dev.txt"
      - "projetos/github_student_dashboard/.coveragerc"
      - ".github/workflows/student-dashboard.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "projetos/github_student_dashboard/**/*.py"
      - "projetos/github_student_dashboard/**/*.html"
      - "projetos/github_student_dashboard/**/*.js"
      - "projetos/github_student_dashboard/**/*.css"
      - "projetos/github_student_dashboard/requirements.txt"
      - "projetos/github_student_dashboard/requirements-dev.txt"
      - "projetos/github_student_dashboard/.coveragerc"
      - ".github/workflows/student-dashboard.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install -r projetos/github_student_dashboard/requirements-dev.txt

      - name: Validate Python syntax
        run: python -m compileall -q projetos/github_student_dashboard

      - name: Validate JavaScript syntax
        run: |
          node --check projetos/github_student_dashboard/static/laboratorio.js
          node --check projetos/github_student_dashboard/static/laboratorio_systems_real.js
          node --check projetos/github_student_dashboard/static/laboratorio_business_real.js
          node --check projetos/github_student_dashboard/static/laboratorio_api_real.js

      - name: Run tests with real coverage
        run: |
          coverage erase
          coverage run --rcfile=projetos/github_student_dashboard/.coveragerc \
            -m unittest discover -s projetos/github_student_dashboard -t . -p "test_*.py"
          coverage report --rcfile=projetos/github_student_dashboard/.coveragerc -m | tee coverage.txt
          coverage json --rcfile=projetos/github_student_dashboard/.coveragerc -o coverage.json
          {
            echo "### Cobertura real de testes"
            echo
            echo "Gate mínimo: 70%."
            echo
            echo '```text'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Audit production dependencies
        run: |
          set +e
          pip-audit -r projetos/github_student_dashboard/requirements.txt | tee pip-audit.txt
          audit_status=${PIPESTATUS[0]}
          set -e
          {
            echo "### Auditoria informativa de dependências"
            echo
            if [ "$audit_status" -eq 0 ]; then
              echo "Nenhuma vulnerabilidade conhecida foi reportada pelo pip-audit nesta execução."
            else
              echo "O pip-audit encontrou ocorrências para revisão. Este passo é informativo e não bloqueia a CI automaticamente."
            fi
            echo
            echo '```text'
            cat pip-audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-quality-evidence
          path: |
            coverage.txt
            coverage.json
            pip-audit.txt
          if-no-files-found: warn
